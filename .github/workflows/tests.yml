name: Contract and real-model format tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Acquire the pinned licensed real samples
        run: uv run --locked python scripts/acquire_v02_samples.py
      - name: Acquire the pinned CC0 Morph format sample
        run: uv run --locked python scripts/acquire_v03_samples.py
      - run: uv run --locked pytest -q
