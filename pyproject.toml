[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "game-asset-factory"
version = "0.3.0"
description = "Local, traceable, engine-independent game asset production"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/dumplingsup/game-asset-factory"
Issues = "https://github.com/dumplingsup/game-asset-factory/issues"

[project.scripts]
gaf = "game_asset_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/game_asset_factory"]
